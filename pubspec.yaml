name: reallife_rpg
description: "RealLife RPG: gerçek hayat için kişiselleştirilebilir gelişim RPG’si"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Only SDK packages: no third-party code runs in this app.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

