name: reallife_rpg
description: "RealLife RPG: gerçek hayat için kişiselleştirilebilir gelişim RPG’si"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

# Only SDK packages: no third-party code runs in this app.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/companions/heads.png
    - assets/companions/moods.png
    - assets/companions/aion_pet.png
    - assets/companions/aion_actions.png
    - assets/companions/sheep_actions.png
    - assets/companions/wolf_actions.png
    - assets/companions/owl_actions.png
    - assets/companions/chest_press.png
    - assets/companions/bench_press.png
    - assets/companions/incline_press.png
    - assets/branding/aion-icon.png
    - assets/data/foods.json
    - assets/data/food_index.json
    - assets/data/NOTICE.txt
    - assets/fonts/OFL.txt
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
